name: Build kdmapper
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild kdmapper/kdmapper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:OutDir=C:\out\
      - uses: actions/upload-artifact@v4
        with:
          name: kdmapper-exe
          path: C:\out\*.exe
        
